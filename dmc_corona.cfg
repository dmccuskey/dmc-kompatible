[DMC_CORONA]

--==================================================--
-- option LUA_PATH, json
--
-- The folders which hold the DMC libraries, relative to
-- the project root. See dmc-corona-boot's documentation:
-- https://github.com/dmccuskey/dmc-corona-boot/blob/master/docs/configuration.md

LUA_PATH:JSON = [ "./dmc_corona" ]



[DMC_KOMPATIBLE]

--==================================================--
-- All options are booleans, true or false (:BOOL optional).
-- See the Configuration section of the README:
-- https://github.com/dmccuskey/dmc-kompatible#configuration
--
-- MAKE_GLOBAL            replace the global display and native, default false
-- PRINT_WARNINGS         print a warning for Graphics 1.0 code that needs
--                        changing (newLine's width), default true
-- ACTIVATE_REFERENCE     add setReferencePoint() and set each new object's
--                        reference point, default true
-- ACTIVATE_FILLCOLOR     add the 0-255 setFillColor(), and setTextColor()
--                        and line:setColor(), default true
-- ACTIVATE_STROKECOLOR   add the 0-255 setStrokeColor(), default true

-- MAKE_GLOBAL:BOOL = false
